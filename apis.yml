aid: advancetechlending
name: Advance Tech Lending
description: 'Advance Tech Lending Inc. (operating as Advance, advance.ph) is a Philippine fintech lender founded
  in 2018 by Jaime de los Angeles and Addi Guevara and headquartered in Taguig, Metro Manila. It operates an on-demand
  salary access and working-capital platform for Southeast Asia: employees of enrolled employers can draw a Salary
  Advance of up to 50% of their monthly basic salary, and businesses can unlock cash through Direct Disbursement
  (invoice/receivables financing) and Payroll Disbursement (payroll funding during cash-flow gaps). The company
  is registered with the Philippine SEC (Company Reg. No. CS201819635) and holds Certificate of Authority No. 2765
  as a lending company, and has raised roughly USD 16-17M in pre-Series A funding from investors including Accion
  Venture Lab, Lendable, Next Billion Ventures and Do Ventures. As of this profile Advance publishes no first-party
  developer program, API reference or machine-readable API contract: advance.ph is a 15-page marketing site with
  no developer path, partner.advance.ph redirects every path to a login, and the only externally visible API listing
  for its salary-loan product sits inside UnionBank''s api.ph partner marketplace.'
